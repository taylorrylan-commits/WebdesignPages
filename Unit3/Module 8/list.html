<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Lists</title>
	</head>
	
	<body>
		<p>Ordered List</p>
		<ol>
			<li>Put the dry ingredients</li>
			<li>Put in the wet ingredients</li>
			<li>Stir</li>
			<li>Bake 350<sup>0</sup> for one hour</li>
			
		<p>Un-ordered List</p>
		<ul>
			<li>Milk</li>
			<li>Eggs</li>
			<li>Cheese</li>
			<li>Flour</li>
		</ul>
	</body>
</html>
